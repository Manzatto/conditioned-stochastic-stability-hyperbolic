review:
  status: self-assessed
  notes: >-
    The proof libraries and Solution built with warnings treated as errors.
    The changed proof definitions and Solution passed strict Lean checks, and
    the project axiom audit permitted only propext, Quot.sound and
    Classical.choice. All four Comparator configurations passed statement
    comparison and NanoDa, con-ron and Lean kernel checking. These local macOS
    checks used --inadvisably-no-sandbox and do not certify Linux sandbox
    isolation. docs/StatementAudit.md records a statement comparison, with
    limits on which definitions were reviewed; docs/LocalVerification.md records
    historical verification. No independent human review of the Lean
    formalization is claimed.

fidelity:
  divergences: >-
    Quasi-ergodicity is tested on bounded measurable real observables using
    survival-conditioned expected Birkhoff averages. Local regularity on the
    closed region is encoded by a nonnegative regular extension on the ambient
    manifold. The global results explicitly assume strict trapping
    T(closure A) subset A and agreement of the physical and reference weights
    on retained basic sets. Theorem 6.5 states measurability of the potential
    separately. Its equilibrium limits concern selected roots; the selected
    family can be smaller than the retained family. A continuous Riemannian
    metric is used. Theorem 3.15 is the
    local compact-injection statement, with its cone and exponent hypotheses.
    The scalar normalizer bounds the exponential weight and is an encoding
    device. See README.md and docs/StatementAudit.md for the full account.
