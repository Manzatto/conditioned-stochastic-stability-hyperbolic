status:
  scope: >-
    This entry selects the qualified local Euclidean formulation of Theorem 3.15 and
    the identities specifying its leaves, Fourier blocks, core coordinates, closure
    and embedding. The proof development contains the six numbered main results and
    the supporting constructions listed in README.md. Theorem 3.15 is the local
    Euclidean compact embedding to which the paper reduces the manifold statement.
    Four independent Challenge modules and Comparator configurations cover all six
    results. The Theorem 6.5 adapter exposes the constructed filtration and measure
    families as existential witnesses, preserving the original literal and labelled
    conclusions and specifying the physical chain. Equilibrium limits are identified
    for selected roots, not for every retained basic set in the filtration order. The
    counts below concern the proof development and exclude deliberate holes in
    independent Challenge statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
