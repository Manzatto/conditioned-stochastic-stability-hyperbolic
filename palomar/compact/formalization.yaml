version: v0.4
project:
  name: "Conditioned stochastic stability III: Local anisotropic compact embedding (Theorem 3.15)"
  description: >-
    Part III of IV of the project "Conditioned stochastic stability of equilibrium
    states on uniformly hyperbolic sets". This entry proves the local Euclidean
    compact embedding between the anisotropic Banach spaces, with the stated cone,
    support and exponent hypotheses. This is the local compact-injection result to
    which the paper reduces the manifold statement; it does not independently claim
    the complete manifold reduction. The four parts share one proof development,
    authorship and mathematical source. Companion parts: I: Local limits (Theorems 2.7
    and 2.8); II: Global limits (Theorems 2.10 and 2.11); IV: Axiom A filtrations and
    selected equilibrium limits (Theorem 6.5). Shared project overview and companion
    statements:
    https://github.com/Manzatto/conditioned-stochastic-stability-hyperbolic#palomar-submission
  authors:
    - Bernat Bassols Cornudella
    - Matheus M Castro
  responsible_maintainers:
    - Bernat Bassols Cornudella
    - Matheus M Castro
  license: Apache-2.0
classification:
  arxiv: [math.DS, math.PR]
  msc2020: [60J05, 37C30, 37D20, 37D35, 37D45]
